name: Release (Manual Version Input)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, e.g. 0.1.0 or v0.1.0'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    env:
      MACOSX_DEPLOYMENT_TARGET: '13.0'
    steps:
      - name: Resolve version metadata
        id: version
        run: |
          set -euo pipefail
          RAW="${{ github.event.inputs.version }}"
          RAW="${RAW## }"
          RAW="${RAW%% }"
          [ -n "$RAW" ] || { echo "version input is required" >&2; exit 1; }
          if [[ "$RAW" == v* ]]; then
            TAG="$RAW"
            VERSION="${RAW#v}"
          else
            TAG="v$RAW"
            VERSION="$RAW"
          fi
          [ -n "$VERSION" ] || { echo "invalid version input: $RAW" >&2; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Build universal libusb
        run: |
          curl -sL -o libusb.tar.bz2 https://github.com/libusb/libusb/releases/download/v1.0.30/libusb-1.0.30.tar.bz2
          tar xjf libusb.tar.bz2
          cd libusb-1.0.30
          CFLAGS="-arch arm64 -arch x86_64 -mmacosx-version-min=13.0 -O2" \
          LDFLAGS="-mmacosx-version-min=13.0" \
            ./configure --disable-udev --disable-examples-build --prefix="$RUNNER_TEMP/libusb" >/dev/null
          make -j"$(sysctl -n hw.ncpu)" >/dev/null
          make install >/dev/null
          lipo -info "$RUNNER_TEMP/libusb/lib/libusb-1.0.0.dylib"

      - name: Build apps
        env:
          PKG_CONFIG_PATH: ${{ runner.temp }}/libusb/lib/pkgconfig
          LIBUSB_DYLIB_ARM64: ${{ runner.temp }}/libusb/lib/libusb-1.0.0.dylib
          LIBUSB_DYLIB_X86_64: ${{ runner.temp }}/libusb/lib/libusb-1.0.0.dylib
          CGO_CFLAGS: -mmacosx-version-min=13.0
          CGO_LDFLAGS: -mmacosx-version-min=13.0
        run: |
          set -eu
          mkdir -p dist
          VERSION="${{ steps.version.outputs.version }}"
          XCODE_BUILD() {
            xcodebuild -project DJOneHubNative.xcodeproj -scheme DJOneHubNative \
              -configuration Release -destination 'platform=macOS' \
              -derivedDataPath build/DerivedData ARCHS="$1" CODE_SIGN_IDENTITY="-" \
              MARKETING_VERSION="$VERSION" build
          }
          XCODE_BUILD "arm64 x86_64"
          cp -R build/DerivedData/Build/Products/Release/DJOneHub.app dist/DJOneHub.app
          XCODE_BUILD "arm64"
          cp -R build/DerivedData/Build/Products/Release/DJOneHub.app dist/DJOneHub-arm64.app
          XCODE_BUILD "x86_64"
          cp -R build/DerivedData/Build/Products/Release/DJOneHub.app dist/DJOneHub-x86_64.app

      - name: Verify macOS deployment target
        run: |
          set -euo pipefail
          EXPECTED_MINOS="13.0"

          check_minos() {
            local binary="$1"
            local values

            if [ ! -f "$binary" ]; then
              echo "::error file=$binary::Missing Mach-O binary"
              return 1
            fi

            values="$(vtool -show-build "$binary" | awk '$1 == "minos" { print $2 }')"
            if [ -z "$values" ]; then
              echo "::error file=$binary::Unable to read LC_BUILD_VERSION minos"
              return 1
            fi

            while IFS= read -r value; do
              if [ "$value" != "$EXPECTED_MINOS" ]; then
                echo "::error file=$binary::Expected minos $EXPECTED_MINOS, got $value"
                return 1
              fi
            done <<< "$values"

            echo "verified minos $EXPECTED_MINOS: $binary"
          }

          for app in \
            dist/DJOneHub.app \
            dist/DJOneHub-arm64.app \
            dist/DJOneHub-x86_64.app; do
            check_minos "$app/Contents/MacOS/DJOneHub"
            check_minos "$app/Contents/Resources/backend/djonehubd"
            check_minos "$app/Contents/Resources/backend/djonehub"
            check_minos "$app/Contents/Resources/backend/djonehub-routing-helper"
            check_minos "$app/Contents/Resources/backend/sing-box"
            check_minos "$app/Contents/Resources/backend/libusb-1.0.0.dylib"
            codesign --verify --deep --strict --verbose=2 "$app"
            for code in \
              "$app/Contents/Resources/backend/djonehubd" \
              "$app/Contents/Resources/backend/djonehub" \
              "$app/Contents/Resources/backend/djonehub-routing-helper" \
              "$app/Contents/Resources/backend/sing-box" \
              "$app/Contents/Resources/backend/libusb-1.0.0.dylib"; do
              codesign --verify --strict --verbose=2 --all-architectures "$code"
            done
          done

      - name: Package sing-box corresponding source
        run: |
          set -euo pipefail
          SOURCE_DIR="$RUNNER_TEMP/sing-box-1.13.16"
          git clone --quiet --depth 1 --branch v1.13.16 \
            https://github.com/SagerNet/sing-box.git "$SOURCE_DIR"
          ACTUAL_COMMIT="$(git -C "$SOURCE_DIR" rev-parse HEAD)"
          EXPECTED_COMMIT="17ec3c71af8ca946dc50bf0d927c39fc77322aec"
          [ "$ACTUAL_COMMIT" = "$EXPECTED_COMMIT" ] || {
            echo "unexpected sing-box commit: $ACTUAL_COMMIT" >&2
            exit 1
          }
          git -C "$SOURCE_DIR" apply --unidiff-zero \
            "$GITHUB_WORKSPACE/scripts/patches/sing-box-1.13.16-djonehub.patch"
          cp "$GITHUB_WORKSPACE/scripts/patches/sing-box-1.13.16-djonehub.patch" \
            "$SOURCE_DIR/DJONEHUB.patch"
          COPYFILE_DISABLE=1 tar -C "$RUNNER_TEMP" --exclude='.git' -czf \
            "$GITHUB_WORKSPACE/dist/sing-box-1.13.16-source.tar.gz" \
            sing-box-1.13.16

      - name: Package DMGs
        run: |
          set -eu
          pipx install dmgbuild
          export PATH="$HOME/.local/bin:$PATH"
          TAG="${{ steps.version.outputs.tag }}"
          for VARIANT in "" "-arm64" "-x86_64"; do
            APP="DJOneHub${VARIANT}.app"
            [ -d "dist/$APP" ] || continue
            DMG="DJOneHub-${TAG}${VARIANT}.dmg"
            sed "s|DJOneHub-arm64.app|$APP|" scripts/dmgbuild.json > "/tmp/dmgbuild${VARIANT}.json"
            dmgbuild -s "/tmp/dmgbuild${VARIANT}.json" "DJOneHub" "dist/$DMG"
            echo "created dist/$DMG"
          done

      - name: Check existing release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          ERROR_FILE="$RUNNER_TEMP/release-check-error"

          if gh api \
            "repos/$GITHUB_REPOSITORY/releases/tags/$TAG_NAME" \
            >/dev/null 2>"$ERROR_FILE"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          elif grep -q "HTTP 404" "$ERROR_FILE"; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            cat "$ERROR_FILE" >&2
            exit 1
          fi

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: |
            dist/DJOneHub-${{ steps.version.outputs.tag }}.dmg
            dist/DJOneHub-${{ steps.version.outputs.tag }}-arm64.dmg
            dist/DJOneHub-${{ steps.version.outputs.tag }}-x86_64.dmg
            dist/sing-box-1.13.16-source.tar.gz
          prerelease: ${{ contains(steps.version.outputs.tag, '-') }}
          generate_release_notes: ${{ steps.release.outputs.exists != 'true' }}
